name: main-ci

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-validation
  cancel-in-progress: false

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_BUILD_JOBS: 4

jobs:
  contract:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: Disable external telemetry
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/telemetry@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
        with:
          rust-version: '1.99.1'
          rust-components: rustfmt,clippy
          rust-targets: wasm32-unknown-unknown
          tools: cargo-audit@0.22.2,cargo-deny@0.20.2,cargo-nextest@0.9.149
      - name: Restore the Cargo dependency and tool cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: native-contract
          add-job-id-key: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev
      - name: Prepare locked source inputs
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
        with:
          recipe: setup
      - name: Check source without compiling
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
        with:
          recipe: check
      - name: Run the native project commands
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
        with:
          recipe: ci-verify
      - name: Retain the actual native test report
        if: ${{ !cancelled() && hashFiles('.nddev-reports/nextest/ci/junit.xml') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rust-tests-${{ github.job }}-${{ github.run_attempt }}
          path: .nddev-reports/nextest/ci/junit.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
      - name: Retain the actual native test report
        if: ${{ !cancelled() && hashFiles('.nddev-reports/bun-test.xml') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: typescript-javascript-tests-${{ github.job }}-${{ github.run_attempt }}
          path: .nddev-reports/bun-test.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Disable external telemetry
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/telemetry@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare the declared Rust SDK
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
        with:
          rust-version: '1.99.1'
          rust-components: rustfmt,clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features

  codegen:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Disable external telemetry
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/telemetry@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.15.0'
      - name: Prepare the declared Rust SDK
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
        with:
          rust-version: '1.99.1'
          rust-components: rustfmt
      - name: Restore the Cargo dependency and tool cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: codegen
          add-job-id-key: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - id: protocol
        run: |
          python - <<'PY'
          import os,re,tomllib
          from pathlib import Path
          lock=tomllib.loads(Path('protocol.lock').read_text())
          assert lock['source_repo']=='NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-protocol'
          assert re.fullmatch('[a-f0-9]{40}',lock['source_commit'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('sha='+lock['source_commit']+'\n')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-protocol
          ref: ${{ steps.protocol.outputs.sha }}
          path: vendor/protocol
          persist-credentials: false
      - run: python scripts/generate.py --check
        env:
          NDS_PROTOCOL_SOURCE: ${{ github.workspace }}/vendor/protocol
          RUSTUP_TOOLCHAIN: '1.99.1'
