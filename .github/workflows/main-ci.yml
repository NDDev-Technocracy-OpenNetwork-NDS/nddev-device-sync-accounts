name: main-ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-validation
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: 4

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev
      - name: Install pinned quality tools
        run: |
          cargo install --locked --version 0.9.148 cargo-nextest
          cargo install --locked --version 0.22.2 cargo-audit
          cargo install --locked --version 0.20.2 cargo-deny
      - name: Run the STD-0004 native Rust contract
        id: native
        uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/ci@a77e385fcf3c1b000c38167ecac7b74bb7715b10 # std-0004-v0.3.1
      - name: Require complete native results
        if: ${{ !cancelled() }}
        env:
          STATUS: ${{ steps.native.outputs.status }}
        run: test "$STATUS" = success

  matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features

  codegen:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.15.0'
      - id: protocol
        run: |
          python - <<'PY'
          import os,re,tomllib
          from pathlib import Path
          lock=tomllib.loads(Path('protocol.lock').read_text())
          assert lock['source_repo']=='NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-protocol'
          assert re.fullmatch('[a-f0-9]{40}',lock['source_commit'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('sha='+lock['source_commit']+'\n')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-protocol
          ref: ${{ steps.protocol.outputs.sha }}
          path: vendor/protocol
          persist-credentials: false
      - run: python scripts/generate.py --check
        env:
          NDS_PROTOCOL_SOURCE: ${{ github.workspace }}/vendor/protocol
