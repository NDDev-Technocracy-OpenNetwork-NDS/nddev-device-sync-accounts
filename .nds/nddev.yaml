# std-0001 repository manifest — schema: `nddev schema manifest`.
apiVersion: nddev.ai/v1alpha4
kind: Repository
metadata:
  id: nddev-device-sync-accounts
  locator: github:NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-accounts
  owner: rldyourmnd
spec:
  standard:
    id: std-0001
  role: component
  profiles:
  - rust
  - typescript
  system:
    id: nds
    root: github:NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync
  portfolios:
  - portfolio:nddev-opennetwork
  provides:
  - name: accounts
    source: src/lib.rs
    direction: code-first
  consumes:
  - contract: nddev-device-sync-protocol/protocol
    via: Cargo.toml
  - contract: nddev-device-sync-core/domain
    via: Cargo.toml
  modules:
  - .
  adaptations:
  - docs/decisions/0001-nds-contract-locations.md
  extensions:
    nddev.standards-system:
      standards:
      - std-0001
  adapters:
  - claude
  - cursor
